name: Generate Pac-Man Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Make background black
        run: |
          sed -i 's/fill="white"/fill="black"/g' dist/pacman-contribution-graph.svg
          sed -i 's/#ffffff/#000000/g' dist/pacman-contribution-graph.svg
          sed -i 's/rgb(255,255,255)/rgb(0,0,0)/g' dist/pacman-contribution-graph.svg

      - name: Push SVG
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
