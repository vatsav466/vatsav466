name: Generate Pac-Man Game

on:
  schedule:
    - cron: "0 */24 * * *"   # runs once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Step 1: Ensure repository workspace is checked out
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Generate the Pac-Man graph (Theme: Dark, Background: Black)
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          theme: dark
          background_color: "#000000"

      # Step 3: Push generated assets from dist folder to the output branch
      - name: Push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
